name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: $MAJOR_VER"
          if [ -z "$MAJOR_VER" ] || ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "Error: Failed to parse Java major version from '$JAVA_VER'."
            exit 1
          fi
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "Error: Active Java major version ($MAJOR_VER) is lower than 17."
            exit 1
          fi
          echo "Java major version ($MAJOR_VER) is 17 or newer. Verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root. Skipping creation."
          else
            echo "debug.keystore not found. Creating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore does not exist after generation attempt."
            exit 1
          fi
          echo "Verified that ./debug.keystore exists."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ]; then
            if [ ! -s "$EXPECTED_APK" ]; then
              echo "Error: $EXPECTED_APK exists but is empty."
              exit 1
            fi
            if [[ "$EXPECTED_APK" != *.apk ]]; then
              echo "Error: $EXPECTED_APK does not have .apk extension."
              exit 1
            fi
            echo "Verified $EXPECTED_APK exists, is a regular non-empty file, and has .apk extension."
          else
            echo "Error: Expected APK $EXPECTED_APK was not found!"
            echo "Searching only inside app/build/outputs/apk..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          ASSET_DIR="${{ runner.temp }}/release-asset"
          mkdir -p "$ASSET_DIR"
          RAW_REPO_NAME="${{ github.event.repository.name }}"
          if [ -z "$RAW_REPO_NAME" ]; then
            RAW_REPO_NAME=$(basename "${{ github.repository }}")
          fi
          SANITIZED_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_NAME" ]; then
            SANITIZED_NAME="app"
          fi
          RELEASE_FILENAME="${SANITIZED_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="${ASSET_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$TARGET_PATH"

          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "Error: Failed to prepare release asset at $TARGET_PATH"
            exit 1
          fi

          echo "asset_path=${TARGET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${RELEASE_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $TARGET_PATH with filename: $RELEASE_FILENAME"

      - name: Publish APK to GitHub Releases
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          RELEASE_ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          RELEASE_ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$RELEASE_ASSET_PATH" ]; then
            echo "Error: Release asset $RELEASE_ASSET_PATH does not exist."
            exit 1
          fi

          if [ ! -s "$RELEASE_ASSET_PATH" ]; then
            echo "Error: Release asset $RELEASE_ASSET_PATH is empty."
            exit 1
          fi

          if [[ "$RELEASE_ASSET_PATH" != *.apk ]]; then
            echo "Error: Release asset $RELEASE_ASSET_PATH does not end in .apk."
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
This is an automatically generated debug APK.
The APK was built by GitHub Actions.
Run Number: ${{ github.run_number }}
Run Attempt: ${{ github.run_attempt }}
Source Commit: ${{ github.sha }}
The APK is intended for testing.
The APK is not a Play Store production release.
The APK is signed only with a temporary debug keystore.
EOF
)

          gh release create "$RELEASE_TAG" "$RELEASE_ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_OUTCOME="${{ steps.create_release.outcome }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=========================================================="
            echo "GitHub Release published successfully!"
            echo "=========================================================="
            gh release view "$RELEASE_TAG"

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            {
              echo "### 🚀 Debug APK Build & Release Succeeded!"
              echo ""
              echo "**Direct Download:** The APK can be downloaded directly on your phone from the [GitHub Release Page]($RELEASE_URL) under **Assets**."
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Asset Name:** \`$ASSET_NAME\`"
              echo "- **Direct Release URL:** $RELEASE_URL"
              echo ""
              echo "ℹ️ **Backup:** The normal Actions artifact \`app-debug-apk\` is also available under the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed."
            echo "The APK build succeeded and the Actions artifact named app-debug-apk remains available."

            {
              echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Warning)"
              echo ""
              echo "The debug APK was built successfully, but automatic GitHub Release publishing encountered an issue or was skipped."
              echo ""
              echo "**Download Location:** The normal Actions artifact named \`app-debug-apk\` remains available under this workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
